<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velvet Roulette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="index-2.css">
</head>
<body>
<header>
  <h1>TAG Roulette</h1>
  <p>Susun daftar hadiah, lalu putar rodanya.</p>
  <div class="rule"></div>
</header>

<main id="mainLayout">
  <section class="stage" aria-label="Roda roulette">
    <div class="wheel-wrap">
      <svg class="pointer" id="pointer" viewBox="0 0 40 56" aria-hidden="true">
        <defs><linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="#8a6a12"/><stop offset=".45" stop-color="#F6E27A"/><stop offset="1" stop-color="#9a7515"/></linearGradient></defs>
        <path d="M20 56 3 18Q-1 4 12 2h16q13 2 9 16z" fill="url(#pg)" stroke="#5a4208" stroke-width="1.5"/>
        <circle cx="20" cy="16" r="6" fill="#8B0000" stroke="#5a4208" stroke-width="1.5"/>
      </svg>
      <canvas id="wheel" aria-label="Roda dengan pilihan hadiah"></canvas>
      <button class="btn gold spin-center" id="spinBtn" type="button" aria-label="Putar roda"></button>
    </div>
    <div class="stage-actions">
      <button class="btn gold toggle-list" id="toggleList" type="button" aria-controls="side" aria-expanded="true">Daftar</button>
    </div>
    <div class="sr" id="live" aria-live="polite"></div>
  </section>

  <aside class="side" id="side" aria-label="Daftar hadiah dan riwayat pemenang">
    <section class="panel p-list" aria-label="Daftar hadiah">
      <h2>Daftar hadiah <span class="count" id="count"></span></h2>
      <form class="add" onsubmit="return false">
        <input type="text" id="newItem" maxlength="40" placeholder="Tulis hadiah, tekan Enter" autocomplete="off" aria-label="Nama hadiah baru">
        <button class="btn small" id="addBtn" type="button">Tambah</button>
      </form>
      <ul id="items"></ul>
      <label class="toggle"><input type="checkbox" id="removeWin"> Hapus pemenang dari roda</label>
      <label class="toggle"><input type="checkbox" id="sound" checked> Suara roda dan kemenangan</label>
      <div class="row">
        <button class="btn small" id="sample" type="button">Contoh</button>
        <button class="btn small" id="clear" type="button">Kosongkan</button>
      </div>
    </section>

    <section class="panel p-hist" aria-label="Riwayat pemenang">
      <h2>Riwayat pemenang <button class="btn small" id="clearHist" type="button">Hapus</button></h2>
      <ul id="history"></ul>
      <p class="empty" id="histEmpty">Belum ada putaran. Tekan Putar untuk mulai.</p>
    </section>
  </aside>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="winName">
  <div class="modal">
    <small>Pemenang</small>
    <div class="win" id="winName"></div>
    <div class="row">
      <button class="btn gold" id="again" style="font-size:1rem;padding:12px 32px">Putar lagi</button>
      <button class="btn small" id="close">Tutup</button>
    </div>
  </div>
</div>

<script src="index-2.js"></script>
</body>
</html>
